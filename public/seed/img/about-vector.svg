<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1152" width="900" height="1152" role="img" aria-label="Illustration of a laptop screen with code and design elements, representing web design, development and SEO">
<defs>
  <linearGradient id="av-g1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3B82F6"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <radialGradient id="av-r1" cx="25%" cy="15%" r="80%">
    <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="av-r2" cx="80%" cy="90%" r="75%">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="900" height="1152" fill="#0D1117"/>
<rect width="900" height="1152" fill="url(#av-r1)"/>
<rect width="900" height="1152" fill="url(#av-r2)"/>

<!-- floating dot grid -->
<g opacity="0.35">
  <circle cx="90" cy="120" r="3" fill="#22D3EE"/>
  <circle cx="130" cy="150" r="3" fill="#3B82F6"/>
  <circle cx="80" cy="190" r="3" fill="#8B5CF6"/>
  <circle cx="800" cy="980" r="3" fill="#22D3EE"/>
  <circle cx="760" cy="1020" r="3" fill="#3B82F6"/>
  <circle cx="820" cy="1050" r="3" fill="#8B5CF6"/>
</g>

<!-- laptop base -->
<rect x="150" y="700" width="600" height="360" rx="26" fill="#141A22" stroke="#232C39" stroke-width="2"/>
<rect x="150" y="700" width="600" height="46" rx="26" fill="#0B0F14" stroke="#232C39" stroke-width="2"/>
<circle cx="184" cy="723" r="6" fill="#3B82F6"/>
<circle cx="208" cy="723" r="6" fill="#22D3EE"/>
<circle cx="232" cy="723" r="6" fill="#8B5CF6"/>

<!-- code lines -->
<rect x="186" y="778" width="150" height="14" rx="7" fill="url(#av-g1)" opacity="0.85"/>
<rect x="186" y="808" width="280" height="12" rx="6" fill="#26313E"/>
<rect x="216" y="834" width="230" height="12" rx="6" fill="#1D2733"/>
<rect x="216" y="860" width="180" height="12" rx="6" fill="#1D2733"/>
<rect x="186" y="892" width="260" height="12" rx="6" fill="#26313E"/>
<rect x="216" y="918" width="200" height="12" rx="6" fill="#1D2733"/>

<!-- browser / design preview panel -->
<rect x="474" y="778" width="252" height="200" rx="14" fill="#0F151D" stroke="#232C39" stroke-width="2"/>
<rect x="494" y="806" width="212" height="26" rx="8" fill="url(#av-g1)" opacity="0.9"/>
<rect x="494" y="846" width="212" height="10" rx="5" fill="#26313E"/>
<rect x="494" y="866" width="160" height="10" rx="5" fill="#1D2733"/>
<rect x="494" y="896" width="98" height="34" rx="17" fill="url(#av-g1)" opacity="0.95"/>
<rect x="606" y="896" width="98" height="34" rx="17" fill="none" stroke="#3B4B5E" stroke-width="1.6"/>

<!-- laptop stand -->
<path d="M150 1060h600l-40 46H190z" fill="#141A22" stroke="#232C39" stroke-width="2"/>
<rect x="380" y="1060" width="140" height="10" rx="5" fill="#0B0F14"/>

<!-- floating SEO / growth chart card -->
<g transform="translate(84,300)">
  <rect width="220" height="150" rx="18" fill="#141A22" stroke="#2A3A4D" stroke-width="2"/>
  <text x="24" y="38" font-family="Sora, Inter, sans-serif" font-size="15" font-weight="700" fill="#F4F7FB">Rankings</text>
  <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#6B7889">ORGANIC GROWTH</text>
  <polyline points="24,120 60,104 96,112 132,80 168,64 196,44" fill="none" stroke="url(#av-g1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="196" cy="44" r="5" fill="#0D1117" stroke="#22D3EE" stroke-width="2.4"/>
</g>

<!-- floating gear / automation icon card -->
<g transform="translate(600,140)">
  <rect width="176" height="176" rx="22" fill="#141A22" stroke="#2A3A4D" stroke-width="2"/>
  <g transform="translate(88,88)">
    <circle r="38" fill="none" stroke="url(#av-g1)" stroke-width="6"/>
    <circle r="12" fill="url(#av-g1)"/>
    <g stroke="url(#av-g1)" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-40"/>
      <line x1="0" y1="52" x2="0" y2="40"/>
      <line x1="-52" y1="0" x2="-40" y2="0"/>
      <line x1="52" y1="0" x2="40" y2="0"/>
      <line x1="-37" y1="-37" x2="-28" y2="-28"/>
      <line x1="37" y1="37" x2="28" y2="28"/>
      <line x1="-37" y1="37" x2="-28" y2="28"/>
      <line x1="37" y1="-37" x2="28" y2="-28"/>
    </g>
  </g>
</g>

<!-- connecting dashed lines -->
<path d="M304 375 L474 800" fill="none" stroke="#2A3A4D" stroke-width="2" stroke-dasharray="6 8"/>
<path d="M688 316 L640 700" fill="none" stroke="#2A3A4D" stroke-width="2" stroke-dasharray="6 8"/>
</svg>
